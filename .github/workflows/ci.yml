# CI du dépôt public zipero-klipper-core (miroir en lecture seule du monorepo Zipero).
# Ce fichier est inerte dans le monorepo ; il devient actif à la racine du miroir.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install tsc --noEmit
      - run: npx --no-install vitest run --coverage
